<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ニコリパズル | こっぴーのマイクラひとやすみ</title>
<link rel="icon" href="./favicon.png"><link rel="stylesheet" href="./style.css">
<style>
.puzzle-wrap{max-width:830px;margin:auto}
.puzzle-card{background:#fffaf3;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow-soft)}
.puzzle-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.puzzle-title{font-size:1.2rem;font-weight:800}
.puzzle-info{font-weight:bold;color:var(--primary-dark)}
.puzzle-board{--cols:8;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:4px;width:min(100%,670px);margin:10px auto 18px;background:#a47f58;border:7px solid #a47f58;border-radius:12px;overflow:hidden}
.puzzle-cell{min-width:0;aspect-ratio:1;background:#f8ebd8;border:0;border-radius:5px;display:flex;align-items:center;justify-content:center;position:relative;font-size:clamp(14px,3.3vw,27px);padding:0}
.puzzle-cell.track{background:#fff6de}.puzzle-cell.cloud{background:#e5f4ff}.puzzle-cell.turn{background:#ffdeb5;cursor:pointer}
.puzzle-cell.turn:focus-visible{outline:3px solid #b34919;outline-offset:-3px}
.puzzle-cell.source{background:#ffe4a5}.puzzle-cell.goal{background:#dfefce}
.puzzle-cell.visited{box-shadow:inset 0 0 0 3px #75b1b9}
.puzzle-cell.current{box-shadow:inset 0 0 0 4px #fb9254}
.puzzle-cell .marker{position:absolute;top:0;right:1px;font-size:10px;font-weight:bold;color:#6e5543}
.puzzle-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.puzzle-controls button{background:var(--primary);border:0;color:#fff;border-radius:999px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}
.puzzle-controls button:disabled{opacity:.45;cursor:not-allowed}
.puzzle-controls button.secondary{background:#7d8fa8}
.puzzle-message{min-height:3em;font-weight:700;line-height:1.6}
.puzzle-characters{display:flex;align-items:center;justify-content:space-between;max-width:670px;margin:12px auto;gap:16px}
.puzzle-characters img{width:76px;height:76px;object-fit:contain}
.puzzle-characters .mascot{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:bold}
.puzzle-rule{font-size:.92rem;color:var(--subtext);line-height:1.7}
@media(max-width:540px){.puzzle-card{padding:10px}.puzzle-board{gap:2px;border-width:4px}.puzzle-characters img{width:50px;height:50px}.puzzle-cell .marker{font-size:8px}}
</style>
</head>
<body>
<header><a href="./index.html"><img src="./favicon.png" alt="サイトロゴ" class="logo"></a><h1>こっぴーのマイクラひとやすみ</h1></header>
<main><section class="puzzle-wrap">
<h2>ニコリパズル 〜つるつる君に届け！〜</h2>
<p>ニコリヒトのビーフシチューから出る湯気を、つるつる君まで届けよう！</p>
<div class="puzzle-characters">
<div class="mascot"><img src="./ニコリヒト.png" alt="ニコリヒト"><span>ニコリヒト<br>ビーフシチュー</span></div>
<div class="mascot"><span>おなかすいた！<br>つるつる君</span><img src="./つるつる君.png" alt="つるつる君"></div>
</div>
<div class="puzzle-card">
<div class="puzzle-top"><span id="level-title" class="puzzle-title"></span><span id="remaining" class="puzzle-info"></span></div>
<div id="board" class="puzzle-board" aria-label="ニコリパズルの盤面"></div>
<p id="message" class="puzzle-message" role="status" aria-live="polite"></p>
<div class="puzzle-controls">
<button id="run" type="button">湯気を飛ばす！</button>
<button id="reset" type="button" class="secondary">やり直す</button>
<button id="next" type="button" hidden>次のステージへ</button>
</div>
<p class="puzzle-rule">エンドレスモード：クリアするたび新しいステージが登場！ 湯気は<strong>5マス進むと消える</strong>。スリープ雲（☁）に入ると残り5マスに回復！ オレンジの矢印パネルはタップするたびに回転するよ。</p>
<p id="hint" class="puzzle-rule"></p>
</div>
</section><a class="button" href="./index.html">トップページに戻る</a></main>
<footer><p>&copy; こっぴー</p></footer>
<script>
"use strict";
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
const ARROWS=["→","↓","←","↑"];
const board=document.getElementById("board");
const message=document.getElementById("message");
const remaining=document.getElementById("remaining");
const runButton=document.getElementById("run");
const nextButton=document.getElementById("next");
const resetButton=document.getElementById("reset");
const key=(x,y)=>x+","+y;
// クリア可能な道筋を先に作り、その道に合わせて雲と回転パネルを配置する。
function generateLevel(number){
 const w=11,h=7;
 const bends=Math.min(3,Math.floor(number/2));
 const startY=1+Math.floor(Math.random()*5);
 const path=[[0,startY]];
 let x=0,y=startY,dir=0;
 const columns=[2,4,6,8].sort(()=>Math.random()-.5).slice(0,bends).sort((a,b)=>a-b);
 function step(nx,ny){x=nx;y=ny;path.push([x,y]);}
 for(const col of columns){
  while(x<col)step(x+1,y);
  const choices=[1,2,3,4,5].filter(v=>v!==y&&Math.abs(v-y)<=3);
  const nextY=choices[Math.floor(Math.random()*choices.length)];
  while(y!==nextY)step(x,y+Math.sign(nextY-y));
 }
 while(x<w-1)step(x+1,y);
 const turns=[];
 for(let i=1;i<path.length-1;i++){
  const [px,py]=path[i-1],[cx,cy]=path[i],[nx,ny]=path[i+1];
  const incoming=[cx-px[0],cy-px[1]].join(",");
  const outgoing=[nx-cx,ny-cy].join(",");
  if(incoming!==outgoing){
   const wanted=DIRS.findIndex(d=>d[0]===nx-cx&&d[1]===ny-cy);
   turns.push([cx,cy,(wanted+1+Math.floor(Math.random()*3))%4]);
  }
 }
 const turnsSet=new Set(turns.map(([tx,ty])=>key(tx,ty)));
 const eligible=path.map((p,i)=>i>0&&i<path.length-1&&!turnsSet.has(key(...p)));
 // 5マス以内に次の雲かゴールが来る配置を探索。
 function plan(last){
  if(path.length-1-last<=5)return [];
  const opts=[];
  for(let at=last+1;at<=Math.min(last+5,path.length-2);at++)if(eligible[at])opts.push(at);
  opts.sort((a,b)=>Math.abs(a-(last+4))-Math.abs(b-(last+4)));
  for(const at of opts){const rest=plan(at);if(rest!==null)return [at,...rest];}
  return null;
 }
 const positions=plan(0);
 if(positions===null)return generateLevel(number);
 const clouds=positions.map(i=>path[i]);
 const used=new Set(path.map(p=>key(...p)));
 const walls=[];
 const count=Math.min(12,number+1);
 for(let tries=0;tries<80&&walls.length<count;tries++){
  const wx=Math.floor(Math.random()*w),wy=Math.floor(Math.random()*h);
  const k=key(wx,wy);
  if(!used.has(k)&&!walls.some(p=>key(...p)===k)){walls.push([wx,wy]);}
 }
 return {name:"エンドレス",w,h,start:path[0],goal:path[path.length-1],
  clouds,turns,walls,hint:"スリープ雲で湯気の残りを5マスに回復！ 回転パネルを正しい向きにしよう。"};
}

let levelIndex=0,level,turns,visited,current,running=false,serial=0,completed=false;
function setMessage(text){message.textContent=text;}
function draw(){
 board.replaceChildren();board.style.setProperty("--cols",level.w);
 const cloudSet=new Set(level.clouds.map(p=>key(...p)));
 const wallSet=new Set(level.walls.map(p=>key(...p)));
 const startKey=key(...level.start),goalKey=key(...level.goal);
 for(let y=0;y<level.h;y++)for(let x=0;x<level.w;x++){
  const k=key(x,y),turn=turns.get(k);
  const cell=document.createElement(turn!==undefined?"button":"div");
  cell.className="puzzle-cell";
  if(turn!==undefined){
   cell.type="button";cell.classList.add("turn");
   cell.textContent=ARROWS[turn];
   cell.setAttribute("aria-label",`(${x+1},${y+1})の方向パネル。現在${ARROWS[turn]}。押すと時計回りに回転`);
   cell.disabled=running||completed;
   cell.onclick=()=>{turns.set(k,(turns.get(k)+1)%4);draw();};
  }else if(k===startKey){cell.classList.add("source");cell.textContent="🍲";}
  else if(k===goalKey){cell.classList.add("goal");cell.textContent="🍽";}
  else if(cloudSet.has(k)){cell.classList.add("cloud");cell.textContent="☁";}
  else if(wallSet.has(k)){cell.textContent="🧱";}
  if(visited.has(k))cell.classList.add("visited");
  if(current===k)cell.classList.add("current");
  board.append(cell);
 }
}
function setup(i){
 serial++;levelIndex=i;level=generateLevel(i+1);running=false;completed=false;
 turns=new Map(level.turns.map(([x,y,d])=>[key(x,y),d]));
 visited=new Set();current=null;
 document.getElementById("level-title").textContent=`エンドレス ステージ ${i+1}`;
 document.getElementById("hint").textContent=level.hint;
 remaining.textContent="湯気の残り：5マス";
 runButton.disabled=false;nextButton.hidden=true;
 setMessage("矢印をタップして、湯気の通り道を作ろう！");draw();
}
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function play(){
 if(running||completed)return;
 running=true;runButton.disabled=true;nextButton.hidden=true;
 const token=++serial;
 let [x,y]=level.start,dir=0,life=5,steps=0;
 current=key(x,y);visited=new Set([current]);draw();
 setMessage("もくもく……湯気が進んでいるよ！");
 const cloudSet=new Set(level.clouds.map(p=>key(...p)));
 const wallSet=new Set(level.walls.map(p=>key(...p)));
 const seen=new Set();
 let success=false,failure="";
 while(steps<150){
  await pause(240);
  if(token!==serial)return;
  if(life===0){failure="湯気が5マスで消えちゃった！スリープ雲を通ろう。";break;}
  x+=DIRS[dir][0];y+=DIRS[dir][1];steps++;life--;
  if(x<0||y<0||x>=level.w||y>=level.h||wallSet.has(key(x,y))){
   failure="道から外れちゃった！矢印の向きを変えてみよう。";break;
  }
  current=key(x,y);visited.add(current);
  if(key(x,y)===key(...level.goal)){success=true;remaining.textContent="つるつる君に到着！";draw();break;}
  if(cloudSet.has(current))life=5;
  if(turns.has(current))dir=turns.get(current);
  remaining.textContent="湯気の残り："+life+"マス";
  draw();
  const state=current+":"+dir+":"+life;
  if(seen.has(state)){failure="同じ場所をぐるぐる回っているよ！";break;}
  seen.add(state);
 }
 if(!success&&!failure)failure="湯気が迷子になっちゃった！";
 if(token!==serial)return;
 running=false;
 if(success){
  completed=true;
  setMessage("クリア！ つるつる君がビーフシチューを食べた！ 次のステージへ進もう！");
  nextButton.hidden=false;
  runButton.disabled=true;
 }else{
  setMessage(failure);
  runButton.disabled=false;
 }
 draw();
}
runButton.onclick=play;
resetButton.onclick=()=>setup(levelIndex);
nextButton.onclick=()=>{if(completed)setup(levelIndex+1);};
setup(0);
</script>
</body></html>
