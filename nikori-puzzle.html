<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ニコリパズル | こっぴーのマイクラひとやすみ</title>
<link rel="icon" href="./favicon.png"><link rel="stylesheet" href="./style.css">
<style>
.puzzle-wrap{max-width:830px;margin:auto}
.puzzle-card{background:#fffaf3;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow-soft)}
.puzzle-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.puzzle-title{font-size:1.2rem;font-weight:800}
.puzzle-info{font-weight:bold;color:var(--primary-dark)}
.puzzle-board{--cols:8;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:4px;width:min(100%,670px);margin:10px auto 18px;background:#a47f58;border:7px solid #a47f58;border-radius:12px;overflow:hidden}
.puzzle-cell{min-width:0;aspect-ratio:1;background:#f8ebd8;border:0;border-radius:5px;display:flex;align-items:center;justify-content:center;position:relative;font-size:clamp(14px,3.3vw,27px);padding:0}
.puzzle-cell.track{background:#fff6de}.puzzle-cell.cloud{background:#e5f4ff}.puzzle-cell.turn{background:#ffdeb5;cursor:pointer}
.puzzle-cell.turn:focus-visible{outline:3px solid #b34919;outline-offset:-3px}
.puzzle-cell.source{background:#ffe4a5}.puzzle-cell.goal{background:#dfefce}
.puzzle-cell.visited{box-shadow:inset 0 0 0 3px #75b1b9}
.puzzle-cell.current{box-shadow:inset 0 0 0 4px #fb9254}
.puzzle-cell .marker{position:absolute;top:0;right:1px;font-size:10px;font-weight:bold;color:#6e5543}
.puzzle-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.puzzle-controls button{background:var(--primary);border:0;color:#fff;border-radius:999px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}
.puzzle-controls button:disabled{opacity:.45;cursor:not-allowed}
.puzzle-controls button.secondary{background:#7d8fa8}
.puzzle-message{min-height:3em;font-weight:700;line-height:1.6}
.puzzle-characters{display:flex;align-items:center;justify-content:space-between;max-width:670px;margin:12px auto;gap:16px}
.puzzle-characters img{width:76px;height:76px;object-fit:contain}
.puzzle-characters .mascot{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:bold}
.puzzle-rule{font-size:.92rem;color:var(--subtext);line-height:1.7}
@media(max-width:540px){.puzzle-card{padding:10px}.puzzle-board{gap:2px;border-width:4px}.puzzle-characters img{width:50px;height:50px}.puzzle-cell .marker{font-size:8px}}
.puzzle-board{position:relative}.puzzle-cell{overflow:hidden}.puzzle-cell img{width:96%;height:96%;object-fit:contain;pointer-events:none}
.puzzle-characters #stew-preview{width:76px;height:76px}
.puzzle-cell.swirl{background:#eee3ff}.puzzle-cell.ice{background:#cdeaff}.puzzle-cell.heat{background:#ffd0b2}
.smoke{position:relative;display:block;width:75%;height:75%;filter:drop-shadow(0 1px 2px #6c718366)}
.smoke i{position:absolute;background:radial-gradient(circle at 40% 35%,#fff,#d5e1e5 65%,#8799a9);border-radius:50%;width:43%;height:43%;animation:smokefloat 1.1s ease-in-out infinite alternate;opacity:.89}
.smoke i:nth-child(1){left:10%;top:43%}.smoke i:nth-child(2){left:38%;top:23%;animation-delay:.25s}.smoke i:nth-child(3){left:53%;top:6%;animation-delay:.5s}
@keyframes smokefloat{to{transform:translate(4px,-7px) scale(1.15);opacity:.55}}
.eating-mascot{position:absolute;width:calc(100% / var(--cols));height:calc(100% / 7);z-index:8;pointer-events:none;display:flex;align-items:center;justify-content:center}
.eating-mascot img{width:90%;height:90%;object-fit:contain;animation:chomp .35s infinite alternate}
@keyframes chomp{to{transform:rotate(-8deg) scale(1.1)}}
@media(prefers-reduced-motion:reduce){.smoke i,.eating-mascot img{animation:none}}
.puzzle-cell.mirror{background:#e4e4e4;color:#283444;font-weight:900}.puzzle-cell.split{background:#e5e5ed;color:#23324b;font-weight:900}
</style>
</head>

<header><a href="./index.html"><img src="./favicon.png" alt="サイトロゴ" class="logo"></a><h1>こっぴーのマイクラひとやすみ</h1></header>
<main><section class="puzzle-wrap">
<h2>ニコリパズル 〜つるつる君に届け！〜</h2>
<p>ニコリヒトのビーフシチューから出る湯気を、つるつる君まで届けよう！</p>
<div class="puzzle-characters">
<div class="mascot"><img src="./ニコリヒト.png" alt="ニコリヒト"><span>ニコリヒト<br>特製ビーフシチュー</span><img id="stew-preview" alt="特製ビーフシチュー"></div>
<div class="mascot"><span>おなかすいた！<br>つるつる君</span><img src="./つるつる君.png" alt="つるつる君"></div>
</div>
<div class="puzzle-card">
<div class="puzzle-top"><span id="level-title" class="puzzle-title"></span><span id="remaining" class="puzzle-info"></span></div>
<div id="board" class="puzzle-board" aria-label="ニコリパズルの盤面"></div>
<p id="message" class="puzzle-message" role="status" aria-live="polite"></p>
<div class="puzzle-controls">
<button id="run" type="button">湯気を飛ばす！</button>
<button id="reset" type="button" class="secondary">やり直す</button>
<button id="next" type="button" hidden>次のステージへ</button>
</div>
<p class="puzzle-rule">エンドレスモード：モノクロ君の反転鏡（◩）と分裂鏡（◇）、旋風・冷気・熱気も登場！ クリアするたび新しいステージが登場！ 湯気は<strong>5マス進むと消える</strong>。スリープ雲（☁）に入ると残り5マスに回復！ オレンジの矢印パネルは8方向に回転。◩は鏡面に合わせて反射、◇は直進と反射の2本に分裂するよ。鏡をタップすると「/」「\\」が切り替わるよ。</p>
<p id="hint" class="puzzle-rule"></p>
</div>
</section><a class="button" href="./index.html">トップページに戻る</a></main>
<footer><p>&copy; こっぴー</p></footer>

// 鏡面 / : (dx,dy) -> (-dy,-dx)、鏡面 \\ : (dx,dy) -> (dy,dx)
function reflectedDirection(direction,orientation){
 const [dx,dy]=DIRS[direction];
 const rx=orientation===0?-dy:dy, ry=orientation===0?-dx:dx;
 return DIRS.findIndex(([x,y])=>x===rx&&y===ry);
}

document.getElementById("stew-preview").src=STEW_IMAGE;
const board=document.getElementById("board");
const message=document.getElementById("message");
const remaining=document.getElementById("remaining");
const runButton=document.getElementById("run");
const nextButton=document.getElementById("next");
const resetButton=document.getElementById("reset");
const key=(x,y)=>x+","+y;
// クリア可能な道筋を先に作り、その道に合わせて雲と回転パネルを配置する。
function generateLevel(number){
 const w=11,h=7;
 const bends=Math.min(3,Math.floor(number/2));
 const startY=1+Math.floor(Math.random()*5);
 const path=[[0,startY]];
 let x=0,y=startY,dir=0;
 const columns=[2,4,6,8].sort(()=>Math.random()-.5).slice(0,bends).sort((a,b)=>a-b);
 function step(nx,ny){x=nx;y=ny;path.push([x,y]);}
 for(const col of columns){
  while(x<col)step(x+1,y);
  const choices=[1,2,3,4,5].filter(v=>v!==y&&Math.abs(v-y)<=3);
  const nextY=choices[Math.floor(Math.random()*choices.length)];
  while(y!==nextY)step(x,y+Math.sign(nextY-y));
 }
 while(x<w-1)step(x+1,y);
 const turns=[];
 for(let i=1;i<path.length-1;i++){
  const [px,py]=path[i-1],[cx,cy]=path[i],[nx,ny]=path[i+1];
  const incoming=[cx-px,cy-py].join(",");
  const outgoing=[nx-cx,ny-cy].join(",");
  if(incoming!==outgoing){
   const wanted=DIRS.findIndex(d=>d[0]===nx-cx&&d[1]===ny-cy);
   turns.push([cx,cy,(wanted+1+Math.floor(Math.random()*7))%8]);
  }
 }
 const turnsSet=new Set(turns.map(([tx,ty])=>key(tx,ty)));
 const eligible=path.map((p,i)=>i>0&&i<path.length-1&&!turnsSet.has(key(...p)));
 // 5マス以内に次の雲かゴールが来る配置を探索。
 function plan(last){
  if(path.length-1-last<=5)return [];
  const opts=[];
  for(let at=last+1;at<=Math.min(last+5,path.length-2);at++)if(eligible[at])opts.push(at);
  opts.sort((a,b)=>Math.abs(a-(last+4))-Math.abs(b-(last+4)));
  for(const at of opts){const rest=plan(at);if(rest!==null)return [at,...rest];}
  return null;
 }
 const positions=plan(0);
 if(positions===null){
  // 安全策：複雑な道で回復地点を置けない場合は直線盤面に切り替える。
  const y=3;
  return {name:"エンドレス",w,h,start:[0,y],goal:[w-1,y],
    clouds:[[4,y],[8,y]],heat:[],swirl:[],ice:[],split:[],mirrors:[],turns:[],walls:[],
    hint:"スリープ雲を通って、湯気をつるつる君へ届けよう！"};
 }
 const clouds=positions.map(i=>path[i]);
 // 雲の一部をアチアチ君の熱気に変更（回復効果は同じ）。
 const heat=(number>=3 && clouds.length)?[clouds.pop()]:[];
 // ぐるぐる君の旋風：時計回りに曲がる角を自動回転に変更。
 const swirl=[];
 if(number>=4){
  for(let i=1;i<path.length-1;i++){
   const [px,py]=path[i-1],[cx,cy]=path[i],[nx,ny]=path[i+1];
   const incoming=DIRS.findIndex(d=>d[0]===cx-px&&d[1]===cy-py);
   const outgoing=DIRS.findIndex(d=>d[0]===nx-cx&&d[1]===ny-cy);
   if((incoming+2)%8===outgoing && turns.some(t=>t[0]===cx&&t[1]===cy)){
    swirl.push([cx,cy]);turns.splice(turns.findIndex(t=>t[0]===cx&&t[1]===cy),1);break;
   }
  }
 }
 // 冷気：通過で残りマスが2減る。正解経路をシミュレートして安全な場所だけ採用。
 const ice=[];
 if(number>=2){
  const recharge=new Set([...clouds,...heat].map(p=>key(...p)));
  const turnsAt=new Set([...turns,...swirl].map(p=>key(p[0],p[1])));
  const candidates=path.slice(1,-1).filter(p=>!recharge.has(key(...p))&&!turnsAt.has(key(...p)));
  for(const candidate of candidates){
   let life=5,valid=true;
   const test=new Set([...ice.map(p=>key(...p)),key(...candidate)]);
   for(let i=1;i<path.length;i++){
    life--;
    const at=key(...path[i]);
    if(recharge.has(at))life=5;
    if(test.has(at))life-=2;
    if(life<0||(life===0&&i<path.length-1)){valid=false;break;}
   }
   if(valid){ice.push(candidate);break;}
  }
 }
 // モノクロ君の分裂鏡は正解ルート上に置く。直進する湯気も残るため必ず解ける。
 const split=[];
 const mirrors=[];
 if(number>=3){
  const blocked=new Set([...clouds,...heat,...ice,...swirl,...turns].map(p=>key(p[0],p[1])));
  const available=path.slice(2,-2).filter(p=>!blocked.has(key(...p)));
  if(available.length){const [sx,sy]=available[Math.floor(available.length/2)];split.push([sx,sy,Math.floor(Math.random()*2)]);}
 }
 if(number>=5){
  const pathSet=new Set(path.map(p=>key(...p)));
  for(let attempts=0;attempts<40;attempts++){
   const mx=1+Math.floor(Math.random()*(w-2)),my=Math.floor(Math.random()*h);
   if(!pathSet.has(key(mx,my))){mirrors.push([mx,my,Math.floor(Math.random()*2)]);break;}
  }
 }
 const used=new Set([...path,...mirrors].map(p=>key(...p)));
 const walls=[];
 const count=Math.min(12,number+1);
 for(let tries=0;tries<80&&walls.length<count;tries++){
  const wx=Math.floor(Math.random()*w),wy=Math.floor(Math.random()*h);
  const k=key(wx,wy);
  if(!used.has(k)&&!walls.some(p=>key(...p)===k)){walls.push([wx,wy]);}
 }
 return {name:"エンドレス",w,h,start:path[0],goal:path[path.length-1],
  clouds,heat,swirl,ice,split,mirrors,turns,walls,hint:"スリープ雲で湯気の残りを5マスに回復！ 回転パネルを正しい向きにしよう。"};
}

let levelIndex=0,level,turns,mirrors,splitMirrors,visited,current,running=false,serial=0,completed=false,activeSmoke=new Set();
function setMessage(text){message.textContent=text;}
function draw(){
 board.replaceChildren();board.style.setProperty("--cols",level.w);
 const cloudSet=new Set(level.clouds.map(p=>key(...p)));
 const wallSet=new Set(level.walls.map(p=>key(...p)));
 const heatSet=new Set(level.heat.map(p=>key(...p)));
 const iceSet=new Set(level.ice.map(p=>key(...p)));
 const swirlSet=new Set(level.swirl.map(p=>key(...p)));
 const startKey=key(...level.start),goalKey=key(...level.goal);
 for(let y=0;y<level.h;y++)for(let x=0;x<level.w;x++){
  const k=key(x,y),turn=turns.get(k),mirror=mirrors.get(k),split=splitMirrors.get(k);
  const cell=document.createElement(turn!==undefined||mirror!==undefined||split!==undefined?"button":"div");
  cell.dataset.pos=k;
  cell.className="puzzle-cell";
  if(turn!==undefined){
   cell.type="button";cell.classList.add("turn");
   cell.textContent=ARROWS[turn];
   cell.setAttribute("aria-label",`(${x+1},${y+1})の方向パネル。現在${ARROWS[turn]}。押すと時計回りに回転`);
   cell.disabled=running||completed;
   cell.onclick=()=>{turns.set(k,(turns.get(k)+1)%8);draw();};
  }else if(mirror!==undefined||split!==undefined){
   const isSplit=split!==undefined,orientation=isSplit?split:mirror;
   cell.type="button";cell.classList.add(isSplit?"split":"mirror");
   cell.textContent=(isSplit?"◇":"◩")+(orientation===0?"/":"\\");
   cell.disabled=running||completed;
   cell.setAttribute("aria-label",(isSplit?"分裂鏡":"反射鏡")+" "+(orientation===0?"/":"バックスラッシュ")+"。タップで鏡面を回転");
   cell.onclick=()=>{const map=isSplit?splitMirrors:mirrors;map.set(k,1-map.get(k));draw();};
  }else if(k===startKey){cell.classList.add("source");const img=document.createElement("img");img.src=STEW_IMAGE;img.alt="ビーフシチュー";cell.append(img);}
  else if(k===goalKey){cell.classList.add("goal");const img=document.createElement("img");img.src="./つるつる君.png";img.alt="つるつる君";cell.append(img);}
  else if(cloudSet.has(k)){cell.classList.add("cloud");cell.textContent="☁";}
  else if(heatSet.has(k)){cell.classList.add("heat");cell.textContent="🔥";}
  else if(iceSet.has(k)){cell.classList.add("ice");cell.textContent="❄️";}
  else if(swirlSet.has(k)){cell.classList.add("swirl");cell.textContent="🌀";}

  else if(wallSet.has(k)){cell.textContent="🧱";}
  if(visited.has(k))cell.classList.add("visited");
  if(activeSmoke.has(k)){cell.classList.add("current");const smoke=document.createElement("span");smoke.className="smoke";smoke.setAttribute("aria-label","進行中の湯気");for(let i=0;i<3;i++)smoke.append(document.createElement("i"));cell.append(smoke);}
  board.append(cell);
 }
}
function setup(i){
 serial++;levelIndex=i;level=generateLevel(i+1);running=false;completed=false;
 turns=new Map(level.turns.map(([x,y,d])=>[key(x,y),d]));
 mirrors=new Map(level.mirrors.map(([x,y,side])=>[key(x,y),side]));
 splitMirrors=new Map(level.split.map(([x,y,side])=>[key(x,y),side]));
 visited=new Set();current=null;activeSmoke=new Set();
 document.getElementById("level-title").textContent=`エンドレス ステージ ${i+1}`;
 document.getElementById("hint").textContent=level.hint;
 remaining.textContent="湯気の残り：5マス";
 runButton.disabled=false;nextButton.hidden=true;
 setMessage("矢印をタップして、湯気の通り道を作ろう！");draw();
}
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function play(){
 if(running||completed)return;
 running=true;runButton.disabled=true;nextButton.hidden=true;
 const token=++serial;
 const origin={x:level.start[0],y:level.start[1],dir:0,life:5};
 let particles=[origin],steps=0,success=false;
 visited=new Set([key(origin.x,origin.y)]);activeSmoke=new Set([key(origin.x,origin.y)]);
 const cloudSet=new Set(level.clouds.map(p=>key(...p)));
 const heatSet=new Set(level.heat.map(p=>key(...p)));
 const iceSet=new Set(level.ice.map(p=>key(...p)));
 const swirlSet=new Set(level.swirl.map(p=>key(...p)));
 const walls=new Set(level.walls.map(p=>key(...p)));
 const seen=new Set();setMessage("もくもく……湯気が進んでいるよ！");draw();
 while(particles.length&&steps++<120){
  await pause(240);if(token!==serial)return;
  const next=[];
  for(const p of particles){
   if(p.life<=0)continue;
   const nx=p.x+DIRS[p.dir][0],ny=p.y+DIRS[p.dir][1],at=key(nx,ny);
   if(nx<0||ny<0||nx>=level.w||ny>=level.h||walls.has(at))continue;
   visited.add(at);
   if(at===key(...level.goal)){success=true;activeSmoke=new Set([at]);break;}
   let life=p.life-1,dir=p.dir;
   if(cloudSet.has(at)||heatSet.has(at))life=5;
   if(iceSet.has(at))life=Math.max(0,life-2);
   if(turns.has(at))dir=turns.get(at);
   if(swirlSet.has(at))dir=(dir+2)%8;
   if(mirrors.has(at))dir=reflectedDirection(dir,mirrors.get(at));
   // 分裂鏡は直進と鏡面反射の2本に分岐
   const directions=splitMirrors.has(at)?[dir,reflectedDirection(dir,splitMirrors.get(at))]:[dir];
   for(const d of directions){
    if(life<=0)continue;
    const state=at+":"+d+":"+life;
    if(seen.has(state))continue;
    seen.add(state);
    next.push({x:nx,y:ny,dir:d,life});
   }
  }
  if(success)break;
  particles=next.slice(0,24);
  activeSmoke=new Set(particles.map(p=>key(p.x,p.y)));
  remaining.textContent=particles.length?"湯気の残り："+Math.max(...particles.map(p=>p.life))+"マス / "+particles.length+"本":"湯気が消えた！";
  draw();
 }
 if(token!==serial)return;
 running=false;activeSmoke=new Set();
 if(success){
  completed=true;
  setMessage("湯気が届いた！ つるつる君がシチューを食べに行くよ！");
  draw();
  const goalCell=board.querySelector('[data-pos="'+key(...level.goal)+'"]');
  const startCell=board.querySelector('[data-pos="'+key(...level.start)+'"]');
  if(goalCell&&startCell){
   const actor=document.createElement("div");actor.className="eating-mascot";
   const img=document.createElement("img");img.src="./つるつる君.png";img.alt="食べに行くつるつる君";actor.append(img);
   actor.style.left=goalCell.offsetLeft+"px";actor.style.top=goalCell.offsetTop+"px";
   actor.style.width=goalCell.offsetWidth+"px";actor.style.height=goalCell.offsetHeight+"px";
   board.append(actor);
   const dx=startCell.offsetLeft-goalCell.offsetLeft,dy=startCell.offsetTop-goalCell.offsetTop;
   const animation=actor.animate([{transform:"translate(0,0)"},{transform:"translate("+dx+"px,"+dy+"px)"}],{duration:850,easing:"ease-in-out",fill:"forwards"});
   await animation.finished.catch(()=>{});
   if(token!==serial)return;
   await pause(600);if(token!==serial)return;
  }
  setMessage("もぐもぐ……おいしい！ クリア！ 次のステージへ進もう！");

  nextButton.hidden=false;runButton.disabled=true;
 }else{
  setMessage("湯気が消えちゃった！ 矢印や鏡の使い方を見直そう。");
  runButton.disabled=false;
 }
 draw();
}
runButton.onclick=play;
resetButton.onclick=()=>setup(levelIndex);
nextButton.onclick=()=>{if(completed)setup(levelIndex+1);};
setup(0);
</script>
