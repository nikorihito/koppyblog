<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ノリノリ掘り掘り！ | こっぴーのマイクラひとやすみ</title><link rel="icon" href="./favicon.png"><link rel="stylesheet" href="./style.css">
<style>
[hidden]{display:none!important}.rh-wrap{max-width:890px;margin:auto}.rh-card{background:#fffaf3;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow-soft)}
.rh-status{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-weight:bold;margin-bottom:14px}.rh-status strong{color:var(--primary-dark)}
.rh-scene{height:300px;position:relative;border-radius:16px;overflow:hidden;background:linear-gradient(#383b46 0%,#41434d 70%,#504c44 70%);border:5px solid #5a504a}
.rh-scene::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:42px 42px}
.rh-ground{position:absolute;bottom:0;height:64px;width:100%;background:repeating-linear-gradient(90deg,#79786d 0 39px,#625f56 40px 42px);border-top:5px solid #b6a489}
.rh-runner{position:absolute;width:126px;height:157px;left:12%;bottom:45px;display:flex;align-items:end;justify-content:center;transition:left .65s linear;z-index:2}
.rh-runner img{width:116px;height:138px;object-fit:contain;filter:drop-shadow(2px 5px 3px #0008)}
.rh-runner.walking img,.rh-runner.dancing img{animation:rh-dance .44s infinite alternate ease-in-out;transform-origin:50% 80%}.rh-runner.mining img{animation:rh-swing .18s 2}
@keyframes rh-dance{0%{transform:translateY(0) rotate(-10deg) scaleX(1)}50%{transform:translateY(-10px) rotate(10deg)}100%{transform:translateY(-3px) rotate(-8deg) scaleX(.96)}}
.rh-tunnel{position:absolute;inset:0;opacity:.55;background:repeating-linear-gradient(90deg,transparent 0 39px,#a2a2a222 40px 42px),repeating-linear-gradient(0deg,transparent 0 39px,#a2a2a222 40px 42px);background-size:42px 42px;pointer-events:none}
.rh-depth{position:absolute;left:12px;top:12px;color:#ffe7b7;font-weight:900;background:#0006;border-radius:9px;padding:5px 10px;z-index:5}
.rh-ore{right:4%!important;bottom:62px!important;width:38%!important;height:175px!important;border-width:8px!important;transform:translateX(0)!important;opacity:1!important}
.rh-ore::before{content:"";position:absolute;inset:0;border:7px solid #ffffff18}
.rh-ore.broken{animation:rh-break .33s forwards}
.rh-runner{left:18%!important;transition:transform .55s ease}
.rh-scene.moving .rh-tunnel{animation:rh-scroll .48s linear infinite}
@keyframes rh-scroll{to{background-position:-42px 0}}
.rh-scene.moving .rh-runner{transform:translateX(20px)}
.rh-ore-label{font-size:1rem!important}
.rh-lanes{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;padding:8px}
.rh-lane{position:relative;width:84px;height:84px;display:grid;place-items:center;touch-action:none}
.rh-key{width:62px;height:62px;z-index:1;position:relative;font-weight:900;font-size:29px;color:#51341f;background:#ffe4b7;border:3px solid #bd8550;border-radius:14px;box-shadow:0 5px #9b653d;cursor:pointer;touch-action:none;user-select:none}
.rh-key.held{transform:translateY(3px);box-shadow:0 2px #9b653d}
.rh-lane-ring{position:absolute;width:62px;height:62px;left:11px;top:11px;border:4px solid #ffbd4b;border-radius:15px;background:transparent!important;pointer-events:none;opacity:0;z-index:3;box-shadow:0 0 7px #ffba5d}
.rh-lane-ring.second{border-color:#64e7ff;box-shadow:0 0 7px #64e7ff}
.rh-cue{color:#ffe18c;font-size:1.05rem;font-weight:900;text-shadow:0 2px #0008;margin-top:10px}

@keyframes rh-bob{to{transform:translateY(-9px) rotate(-3deg)}}@keyframes rh-swing{to{transform:rotate(-12deg) translateX(8px)}}
.rh-ore{position:absolute;right:13%;bottom:65px;width:110px;height:110px;display:grid;place-items:center;background:#858d95;border:7px solid #616a73;box-shadow:inset -10px -12px #535e68,0 8px 0 #0004;transform:scale(.6);opacity:0;transition:transform .4s,opacity .35s}
.rh-ore.show{transform:scale(1);opacity:1}.rh-ore.broken{animation:rh-break .38s forwards}
@keyframes rh-break{to{opacity:0;transform:scale(1.35) rotate(12deg)}}
.rh-ore::after{content:"";width:73%;height:73%;background:radial-gradient(circle at 25% 30%,var(--gem) 0 10%,transparent 12%),radial-gradient(circle at 74% 62%,var(--gem) 0 13%,transparent 15%),radial-gradient(circle at 55% 12%,var(--gem) 0 8%,transparent 10%);filter:drop-shadow(1px 2px #0006)}
.rh-ore.stone{--gem:#aeb6b9}.rh-ore.iron{--gem:#dbac77}.rh-ore.diamond{--gem:#65e9e9}
.rh-ore-label{position:absolute;bottom:8px;color:white;text-shadow:0 2px 3px #000;font-size:.85rem;font-weight:800}
.rh-flash{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:clamp(23px,4vw,38px);font-weight:900;text-shadow:0 3px 5px #0008;color:#fff}
.rh-flash.perfect{color:#ffe48c}.rh-flash.good{color:#b8f8ff}.rh-flash.miss{color:#ffafaf}
.rh-controls{padding-top:15px;display:flex;align-items:center;flex-direction:column;gap:10px}
.rh-hitbox{width:172px;height:172px;position:relative;display:grid;place-items:center;touch-action:none}
.rh-pickaxe{width:108px;height:108px;position:relative;z-index:2;border:4px solid #a65c27;border-radius:50%;background:linear-gradient(140deg,#ffdc9d,#f49c52);color:#523017;cursor:pointer;font-size:52px;box-shadow:0 6px 0 #a55c2c,0 8px 18px #a5683970;touch-action:none;user-select:none;display:grid;place-items:center}
.rh-pickaxe:active,.rh-pickaxe.holding{transform:translateY(4px);box-shadow:0 2px 0 #a55c2c}
.rh-ring{position:absolute;left:32px;top:32px;width:108px;height:108px;border:5px solid #ffe494;border-radius:50%;pointer-events:none;z-index:3;opacity:0;box-shadow:0 0 10px #ffcf64b0}
.rh-ring.second{border-color:#76e7f1;box-shadow:0 0 11px #7de8f1aa}
.rh-hold{height:8px;width:172px;border-radius:8px;background:#e7d7c3;overflow:hidden}.rh-hold-fill{width:0;height:100%;background:#f19a46}
.rh-action{font-weight:bold;color:var(--primary-dark);min-height:1.6em}
.rh-btn{border:0;border-radius:999px;background:var(--primary);color:white;font:inherit;font-weight:800;padding:14px 26px;cursor:pointer}.rh-btn:disabled{opacity:.5}
.rh-guide{text-align:left;line-height:1.8;font-size:.94rem;color:var(--subtext)}
.rh-summary{font-size:1.15rem;font-weight:800;min-height:1.7em}
@media(max-width:580px){.rh-card{padding:10px}.rh-scene{height:245px}.rh-runner{width:90px;height:120px;bottom:42px}.rh-runner img{height:110px}.rh-ore{width:80px;height:80px;bottom:58px}.rh-ground{height:55px}}
@media(prefers-reduced-motion:reduce){.rh-runner.walking img,.rh-runner.mining img{animation:none}}

.rh-ore{display:grid!important;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:2px;padding:3px;background:#555d61!important;border:6px solid #4a5054!important}
.rh-ore::before,.rh-ore::after{display:none!important}
.rh-pebble{min-width:0;min-height:0;background:#92989a;border:2px solid #6e767a;box-shadow:inset -3px -3px #747b7d;border-radius:3px}
.rh-ore.iron .rh-pebble:nth-child(3n){background:#cbaa83}
.rh-ore.diamond .rh-pebble:nth-child(3n){background:#6fe1e9}
.rh-ore-label{grid-column:1/-1;position:absolute;top:-32px;bottom:auto!important;left:0;right:0}
.rh-scene.moving .rh-ground{animation:rh-scroll .42s linear infinite}
.rh-runner.dancing img{animation:rh-dance .33s infinite alternate}
.rh-flash.perfect{font-size:clamp(29px,5vw,46px);filter:drop-shadow(0 0 8px #ffbd57)}
@media(max-width:580px){.rh-ore{height:145px!important}}
</style></head>
<body><header><a href="./index.html"><img src="./favicon.png" class="logo" alt="サイトロゴ"></a><h1>こっぴーのマイクラひとやすみ</h1></header>
<main><section class="rh-wrap"><h2>ノリノリ掘り掘り！</h2><p>ノリノリヒトと踊りながら、石をどんどん砕いてエンドレスに進もう！</p>
<div class="rh-card">
<div class="rh-status"><span>採掘数 <strong id="progress">0</strong></span><span>スコア <strong id="score">0</strong></span><span>コンボ <strong id="combo">0</strong></span></div>
<div class="rh-scene" aria-label="採掘ゲームの画面">
<div class="rh-tunnel" id="tunnel"></div><div class="rh-depth" id="depth">深さ 0 m</div><div class="rh-ground"></div><div class="rh-runner" id="runner"><img src="./ノリノリヒト.png" alt="ノリノリヒト"></div>
<div class="rh-ore stone" id="ore"><span class="rh-ore-label" id="ore-label">石</span></div>
<div class="rh-flash" id="flash" aria-live="polite"></div>
</div>
<div class="rh-controls">
<div id="instruction" class="rh-action">スタートでエンドレス採掘！ どんどん掘って進もう！</div>
<div class="rh-lanes" id="hitbox" hidden>
<div class="rh-lane" data-dir="ArrowLeft"><span class="rh-lane-ring"></span><span class="rh-lane-ring second"></span><button type="button" class="rh-key" data-dir="ArrowLeft" aria-label="左">←</button></div>
<div class="rh-lane" data-dir="ArrowUp"><span class="rh-lane-ring"></span><span class="rh-lane-ring second"></span><button type="button" class="rh-key" data-dir="ArrowUp" aria-label="上">↑</button></div>
<div class="rh-lane" data-dir="ArrowDown"><span class="rh-lane-ring"></span><span class="rh-lane-ring second"></span><button type="button" class="rh-key" data-dir="ArrowDown" aria-label="下">↓</button></div>
<div class="rh-lane" data-dir="ArrowRight"><span class="rh-lane-ring"></span><span class="rh-lane-ring second"></span><button type="button" class="rh-key" data-dir="ArrowRight" aria-label="右">→</button></div>
</div>
<div class="rh-hold" id="hold" hidden><div class="rh-hold-fill" id="hold-fill"></div></div>
<button class="rh-btn" id="start" type="button">スタート！</button><button class="rh-btn" id="stop" type="button" hidden>終了して記録を見る</button>
<div id="summary" class="rh-summary" role="status" aria-live="polite"></div>
</div>
<p class="rh-guide"><strong>石：</strong>光の枠が矢印ボタンと重なった瞬間に、対応する方向を押す。<strong>鉄：</strong>対応する矢印を長押し（約0.7秒）。<strong>ダイヤ：</strong>黄色と青の2つの輪に合わせて2回押す。<br>PCは方向キー（←↑↓→）、スマホは画面の矢印。ノリノリヒトが踊りながら、壁を掘り進むよ！</p>
</div></section><a class="button" href="./index.html">トップページに戻る</a></main><footer><p>&copy; こっぴー</p></footer>
<script>"use strict";
const $=id=>document.getElementById(id);
const sequence=["stone","stone","iron","stone","diamond","stone","iron","stone","diamond","iron","stone","diamond"];
const dirs=["ArrowLeft","ArrowUp","ArrowRight","ArrowDown"];
const labels={stone:"石",iron:"鉄鉱石",diamond:"ダイヤモンド鉱石"};
const icons={ArrowLeft:"←",ArrowUp:"↑",ArrowRight:"→",ArrowDown:"↓"};
const beatTime=1800, perfectWindow=165,goodWindow=350,holdDuration=420;
let state="idle",index=0,score=0,combo=0,perfect=0,good=0,miss=0,frameId=0,roundId=0;
let targets=[],done=0,heldKey=null,holdAt=0,holdRating="",audio=null,depth=0,visibleAt=0;
const start=$("start"),stop=$("stop"),ore=$("ore"),runner=$("runner"),scene=document.querySelector(".rh-scene");
const keyEls=[...document.querySelectorAll(".rh-key")],lanes=[...document.querySelectorAll(".rh-lane")];
function sound(freq=420,length=.09,type="triangle"){
 try{const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;if(!audio)audio=new Audio();
 audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;
 o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.055,t);
 g.gain.exponentialRampToValueAtTime(.001,t+length);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+length+.02);}catch(e){}
}
function stats(){$("progress").textContent=index;$("score").textContent=score;$("combo").textContent=combo;$("depth").textContent="深さ "+depth+" m";}
function flash(t,kind=""){const el=$("flash");el.textContent=t;el.className="rh-flash "+kind;}
function setInstruction(){const type=sequence[index%sequence.length],d=targets.map(t=>icons[t.dir]).join(" → ");
 $("instruction").textContent=(type==="iron"?"長押し：":type==="diamond"?"2連続：":"タイミング：")+d;}
function clearRings(){lanes.forEach(l=>l.querySelectorAll(".rh-lane-ring").forEach(r=>r.style.opacity="0"));$("hold").hidden=true;$("hold-fill").style.width="0%";}
function scheduleRound(){
 // エンドレスモード
 roundId++;done=0;heldKey=null;holdAt=0;clearRings();flash("");
 const type=sequence[index%sequence.length];
 const d1=dirs[(index*5+Math.floor(index/3))%4];
 const d2=dirs[(index*3+2)%4];
 const t=performance.now()+beatTime;
 targets=type==="diamond"?[{dir:d1,time:t},{dir:d2,time:t+720}]:[{dir:d1,time:t}];
 ore.className="rh-ore "+type+" show";
 ore.querySelectorAll(".rh-pebble").forEach(n=>n.remove());
 for(let i=0;i<25;i++){const chip=document.createElement("i");chip.className="rh-pebble";ore.append(chip);}
 $("ore-label").textContent=labels[type];
 runner.className="rh-runner dancing";scene.classList.add("moving");
 state="approach";visibleAt=performance.now()+520;setInstruction();
 sound(320,.08);
}
function startGame(){
 cancelAnimationFrame(frameId);roundId++;index=0;score=0;combo=0;perfect=0;good=0;miss=0;depth=0;
 start.hidden=true;stop.hidden=false;$("hitbox").hidden=false;$("summary").textContent="";stats();
 scheduleRound();frameId=requestAnimationFrame(frame);
}
function judge(r){
 if(r==="PERFECT"){perfect++;score+=300+combo*10;sound(850);}
 else{good++;score+=150+combo*5;sound(630);}
 combo++;flash(r,r.toLowerCase());runner.className="rh-runner dancing";stats();
}
function advance(won){
 state="transition";heldKey=null;keyEls.forEach(k=>k.classList.remove("held"));clearRings();
 if(won){ore.classList.add("broken");depth+=3;stats();sound(250,.12,"square");}
 else{miss++;combo=0;depth+=1;ore.classList.add("broken");stats();sound(230,.07,"triangle");}
 const ticket=++roundId;
 setTimeout(()=>{if(ticket!==roundId||state!=="transition")return;index++;stats();scheduleRound();},350);
}
function press(dir){
 if(state!=="active"||heldKey)return;
 const target=targets[done];if(!target)return;
 const deviation=Math.abs(performance.now()-target.time);
 if(dir!==target.dir||deviation>goodWindow){flash("あと少し！","good");sound(310,.07);return;}
 heldKey=dir;document.querySelector('.rh-key[data-dir="'+dir+'"]').classList.add("held");
 const rating=deviation<=perfectWindow?"PERFECT":"GOOD";
 if(sequence[index%sequence.length]==="iron"){holdAt=performance.now();holdRating=rating;$("hold").hidden=false;flash("長押し！");sound(350,.1);return;}
 done++;judge(rating);heldKey=null;keyEls.forEach(k=>k.classList.remove("held"));
 if(done===targets.length)advance(true);
}
function release(dir){
 if(heldKey!==dir)return;
 heldKey=null;keyEls.forEach(k=>k.classList.remove("held"));
 if(state==="active"&&sequence[index%sequence.length]==="iron"){
  if(performance.now()-holdAt<holdDuration){flash("長押しが短い！","miss");advance(false);}
  else{judge(holdRating);advance(true);}
 }
}
function frame(now){
 if(state==="idle"||state==="finished")return;
 if(state==="approach"&&now>=visibleAt)state="active";
 if(state==="active"){
  const t=targets[done];
  if(t&&now>t.time+goodWindow&&!(sequence[index%sequence.length]==="iron"&&heldKey)){flash("次へ！","good");advance(false);}
  else if(sequence[index%sequence.length]==="iron"&&heldKey){
   const portion=Math.min(1,(now-holdAt)/holdDuration);$("hold-fill").style.width=(portion*100)+"%";
   if(portion>=1){judge(holdRating);advance(true);}
  }
  if(state==="active")targets.forEach((target,i)=>{
   const lane=document.querySelector('.rh-lane[data-dir="'+target.dir+'"]');
   const rings=lane.querySelectorAll(".rh-lane-ring");
   const slot=i===0?0:1,ring=rings[slot];
   const delta=target.time-now;
   ring.style.opacity=(i>=done&&delta<=beatTime&&delta>=-goodWindow)?"1":"0";
   if(i>=done){const scale=1+Math.max(-.15,delta/beatTime)*1.45;ring.style.transform="scale("+Math.max(.85,scale)+")";}
  });
 }
 frameId=requestAnimationFrame(frame);
}
function finish(){
 state="finished";scene.classList.remove("moving");runner.className="rh-runner dancing";
 clearRings();$("hitbox").hidden=true;stop.hidden=true;start.hidden=false;start.textContent="もう一度あそぶ";
 flash("FINISH!","perfect");$("instruction").textContent="採掘完了！";
 $("summary").textContent="深さ "+depth+" m・"+score+"点 / PERFECT "+perfect+"・GOOD "+good+"・MISS "+miss;
}
start.addEventListener("click",startGame);
stop.addEventListener("click",()=>{roundId++;cancelAnimationFrame(frameId);finish();});
keyEls.forEach(button=>{
 button.addEventListener("pointerdown",e=>{e.preventDefault();try{button.setPointerCapture(e.pointerId)}catch(_){}press(button.dataset.dir)});
 button.addEventListener("pointerup",e=>{e.preventDefault();release(button.dataset.dir)});
 button.addEventListener("pointercancel",()=>release(button.dataset.dir));
});
window.addEventListener("keydown",e=>{if(!dirs.includes(e.key)||e.repeat)return;e.preventDefault();press(e.key)});
window.addEventListener("keyup",e=>{if(dirs.includes(e.key)){e.preventDefault();release(e.key)}});
window.addEventListener("blur",()=>{if(heldKey)release(heldKey)});
stats();
</script></body></html>
